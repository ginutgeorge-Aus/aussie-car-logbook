name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: For non-trivial work, please open this before writing code so we agree on the approach.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: tax-impact
    attributes:
      label: Tax / ATO impact
      description: Does this touch tax math, BAS, GST, or the logbook method? Cite the ATO rule if so.
    validations:
      required: false
