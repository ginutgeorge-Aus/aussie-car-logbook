name: release-please

# Keeps a Release PR open from the Conventional Commit titles on main (PRs are
# squash-merged, so the PR title is the commit). Merging the Release PR bumps
# package.json, updates CHANGELOG.md, tags vX.Y.Z and creates the GitHub Release.
# It does NOT deploy — see docs/deploy-auto.md.
#
# Needs repo secret RELEASE_PLEASE_TOKEN (fine-grained PAT, this repo only,
# Contents + Pull requests: read & write). PRs opened with GITHUB_TOKEN don't
# trigger CI, so the required checks would never run on the Release PR.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
