name: Secret Scan

# Public repo — the hard rule is: never commit secrets, account_id/database_id,
# personal data, or receipt images. gitleaks blocks a leak before it merges,
# and a weekly full-history sweep catches anything buried in an old commit.
# gitleaks-action is free for public repositories (no org licence needed).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC — full-history sweep
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on the weekly sweep; shallow is fine for push/PR diffs.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
