name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # corepack activates the pinned pnpm from package.json#packageManager,
      # and makes the `pnpm` shim available for setup-node's cache.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tax-engine correctness gate
      - name: Test
        run: pnpm test

      # Production build = also the typecheck gate (next build runs tsc)
      - name: Build
        run: pnpm build
