name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # corepack activates the pinned pnpm from package.json#packageManager,
      # and makes the `pnpm` shim available for setup-node's cache.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Unused files / exports / dependencies
      - name: Knip
        run: pnpm knip

      # Tax-engine correctness gate
      - name: Test
        run: pnpm test

      # Production build = also the typecheck gate (next build runs tsc)
      - name: Build
        run: pnpm build
